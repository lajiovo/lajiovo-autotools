<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>云端剪切板 - Perseus</title>
  <link rel="stylesheet" href="dash.css">
  <link rel="stylesheet" href="clipboard.css">
</head>
<body>

<div class="container">
  <header>
    <h1>📋 云端剪切板 & 文件缓存</h1>
    <button class="btn-primary" style="flex: none; min-width: auto; padding: 6px 14px;" onclick="location.href='/main/index.html'">🏠 返回主菜单</button>
  </header>

  <div class="dashboard-layout">
    <!-- 左侧：文本内容编辑 -->
    <div class="options-pane">
      <div class="card">
        <div class="card-title">文本缓存内容</div>
        <textarea id="textClipboard" placeholder="在此输入需要缓存的文本内容..."></textarea>
        <div class="btn-group">
          <button class="btn-success" onclick="saveText()">💾 保存文本内容</button>
          <button class="btn-accent" onclick="copyText()">📄 复制到剪切板</button>
          <button class="btn-warning" onclick="fetchData()">🔄 刷新数据</button>
        </div>
      </div>

      <div class="card">
        <div class="card-title">上传图片缓存</div>
        <div class="upload-area" id="uploadArea">
          <p>点击或拖拽图片至此处上传</p>
          <input type="file" id="fileInput" accept="image/*" style="display: none;">
        </div>
        <div id="uploadStatus" class="status-text"></div>
      </div>
    </div>

    <!-- 右侧：图片画廊 -->
    <div class="console-pane">
      <div class="card" style="height: 100%; display: flex; flex-direction: column;">
        <div class="card-title">图片缓存画廊</div>
        <div id="imageGallery" class="image-grid">
          <!-- 图片将在此动态加载 -->
          <div class="loading">加载中...</div>
        </div>
      </div>
    </div>
  </div>

  <!-- 吐司提示 -->
  <div id="toast" class="toast"></div>
</div>

<script src="clipboard.js"></script>
</body>
</html>
