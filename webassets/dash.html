<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>系统控制面板</title>
  <link rel="stylesheet" href="dash.css">
</head>
<body>

<div class="container">
  <header>
    <h1>控制中心 Dashboard</h1>
    <button class="btn-primary" style="flex: none; min-width: auto; padding: 6px 14px;" onclick="goToMainMenu()">🏠 返回主菜单</button>
  </header>

  <!-- 响应式分屏主体容器 -->
  <div class="dashboard-layout">
    
    <!-- 左侧：功能选项面板 -->
    <div class="options-pane">
      
      <!-- 实时服务与仪表盘数据展示卡片 -->
      <div class="card" style="background: linear-gradient(135deg, rgba(30,41,59,0.85), rgba(15,23,42,0.9)); border: 1px solid rgba(99,102,241,0.3);">
        <div class="card-title" style="display: flex; justify-content: space-between; align-items: center;">
          <span>📊 系统运行状态与仪表盘监控</span>
          <button class="btn-primary" style="padding: 2px 8px; font-size: 0.7rem;" onclick="loadSystemStatusAndDashboard()">🔄 刷新数据</button>
        </div>
        
        <!-- 服务状态指示条 -->
        <div id="serviceStatusIndicator" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 8px; padding: 4px 0;">
          <div style="background: rgba(15,23,42,0.6); padding: 8px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.08); text-align: center;">
            <div style="font-size: 0.75rem; color: #94a3b8;">HandlePush</div>
            <div id="svHandlepush" style="font-size: 0.85rem; font-weight: bold; margin-top: 2px; color: #f59e0b;">检查中...</div>
          </div>
          <div style="background: rgba(15,23,42,0.6); padding: 8px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.08); text-align: center;">
            <div style="font-size: 0.75rem; color: #94a3b8;">MuMu 进程</div>
            <div id="svMumu" style="font-size: 0.85rem; font-weight: bold; margin-top: 2px; color: #94a3b8;">检查中...</div>
          </div>
          <div style="background: rgba(15,23,42,0.6); padding: 8px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.08); text-align: center;">
            <div style="font-size: 0.75rem; color: #94a3b8;">Alas 进程</div>
            <div id="svAlas" style="font-size: 0.85rem; font-weight: bold; margin-top: 2px; color: #94a3b8;">检查中...</div>
          </div>
        </div>

        <!-- 仪表盘 HTML 容器 -->
        <div id="dashboardContainer" style="background: rgba(15,23,42,0.5); padding: 12px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.05); max-height: 320px; overflow-y: auto;">
          <p style="color: #94a3b8; font-size: 0.85rem; text-align: center;">正在加载仪表盘缓存数据...</p>
        </div>
      </div>

      <!-- 基础控制功能卡片网格 -->
      <div class="grid-cards">
        <!-- 核心控制 -->
        <div class="card">
          <div class="card-title">系统核心控制</div>
          <div class="btn-group">
            <button class="btn-primary" onclick="sendReq('/ping')">⚡ Ping</button>
            <button class="btn-success" onclick="sendReq('/start')">▶️ 启动系统</button>
            <button class="btn-warning" onclick="sendReq('/stop')">⏸️ 暂停系统</button>
            <button class="btn-danger" onclick="sendReq('/shutdown')">🛑 关机</button>
          </div>
        </div>

        <!-- Bot 服务 -->
        <div class="card">
          <div class="card-title">Bot 服务</div>
          <div class="btn-group">
            <button class="btn-success" onclick="sendReq('/bot/start')">🤖 启动 Bot</button>
            <button class="btn-danger" onclick="sendReq('/bot/shutdown')">🤖 关闭 Bot</button>
          </div>
        </div>

        <!-- 音乐服务 -->
        <div class="card">
          <div class="card-title">音乐服务</div>
          <div class="btn-group">
            <button class="btn-success" onclick="sendReq('/music/start')">🎵 播放音乐</button>
            <button class="btn-accent" onclick="sendReq('/music/ffm')">🎵 播放 FFM</button>
            <button class="btn-danger" style="flex: 1 1 100%" onclick="sendReq('/music/stop')">⏹️ 停止音乐</button>
          </div>
        </div>

        <!-- CP 交互 -->
        <div class="card">
          <div class="card-title">CP 交互</div>
          <div class="btn-group">
            <button class="btn-success" onclick="sendReq('/cp/start')">▶️ CP 启动</button>
            <button class="btn-danger" onclick="sendReq('/cp/stop')">⏹️ CP 停止</button>
            <button class="btn-accent" style="flex: 1 1 100%" onclick="sendReq('/cp/get')">📥 CP 获取数据</button>
          </div>
        </div>

        <!-- LK 模块 -->
        <div class="card">
          <div class="card-title">LK 模块</div>
          <div class="form-group">
            <div class="input-with-btn">
              <input type="number" id="bookId" placeholder="输入 Book ID (数字)">
              <button class="btn-accent" onclick="sendBookId()">发送 ID</button>
            </div>
            <div class="toggle-group">
              <div class="toggle-item">
                <span>仅重新下载图片 (only)</span>
                <label class="switch">
                  <input type="checkbox" id="onlySwitch">
                  <span class="slider"></span>
                </label>
              </div>
              <div class="toggle-item">
                <span>仅使用缓存 (cache)</span>
                <label class="switch">
                  <input type="checkbox" id="cacheSwitch">
                  <span class="slider"></span>
                </label>
              </div>
            </div>
          </div>
          <div class="btn-group">
            <button class="btn-danger" style="flex: 1 1 100%" onclick="sendReq('/lk/stop')">⏹️ LK 停止</button>
          </div>
        </div>
      </div>

      <!-- /push 拼接字典面板 -->
      <div class="card">
        <div class="card-title">推送字典数据 (/push)</div>
        <div class="form-group" id="pushKvContainer">
          <!-- 动态加载 key-value 控件 -->
        </div>
        <button class="btn-add" onclick="addKvRow('pushKvContainer')">➕ 添加键值条目</button>
        <div class="btn-group" style="margin-top: 4px;">
          <button class="btn-primary" style="flex: 1 1 100%" onclick="sendKvDict('/push', 'pushKvContainer')">📤 推送至 /push</button>
        </div>
      </div>

      <!-- /run 拼接字典面板 -->
      <div class="card">
        <div class="card-title">执行任务数据 (/run)</div>
        <div class="form-group" id="runKvContainer">
          <!-- 动态加载 key-value 控件 -->
        </div>
        <button class="btn-add" onclick="addKvRow('runKvContainer')">➕ 添加键值条目</button>
        <div class="btn-group" style="margin-top: 4px;">
          <button class="btn-accent" style="flex: 1 1 100%" onclick="sendKvDict('/run', 'runKvContainer')">🚀 执行至 /run</button>
        </div>
      </div>

    </div>

    <!-- 右侧：输出日志控制台（移动端自动变为下侧） -->
    <div class="console-pane">
      <div class="card console-card">
        <div class="console-header">
          <div class="card-title" style="border:none; padding:0;">响应日志</div>
          <button class="btn-warning" style="min-width:auto; padding:4px 10px; font-size:0.75rem;" onclick="clearLog()">清空</button>
        </div>
        <div class="console-log" id="consoleLog">
          <div class="log-entry log-info"><span class="log-time">[系统]</span>控制台就绪...</div>
        </div>
      </div>
    </div>

  </div>
</div>

<script src="dash.js"></script>
</body>
</html>
